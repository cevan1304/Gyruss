<script>
'use strict';
const SOURCES=["assets/intro-01-6a30caea7f.webp", "assets/intro-02-427a44265e.webp", "assets/intro-03-29b0533360.webp", "assets/intro-04-440dfcf5c1.webp", "assets/intro-05-d7ac3ae4a5.webp", "assets/intro-06-05363a67a1.webp", "assets/intro-07-2e219450df.webp", "assets/intro-08-5fd91037ab.webp", "assets/intro-09-e2e7058252.webp", "assets/intro-10-0bb2a10f9e.webp"];
document.getElementById('pilotImage').src=SOURCES[4];
const names=['Earth in danger','Alert','Orders','Aurora awaits','Ready','Boarding','Activation','Launch','Beyond the atmosphere','First contact'];
const $=id=>document.getElementById(id),c=$('stage'),ctx=c.getContext('2d',{alpha:false});
const music=$('music');

const gameframe=$('gameframe');let gameReady=false,gameStarted=false,wantsGame=false;

// One personal best per normalized pilot name; only the best 50 are retained.
const SCORE_KEY='gyruss.top50.v1',PILOT_KEY='gyruss.pilot.v1';
function cleanPilot(value){return typeof value==='string'?Array.from(value.normalize('NFC').replace(/[\u0000-\u001f\u007f]/g,'').trim().replace(/\s+/g,' ')).slice(0,20).join(''):''}
function pilotKey(name){return cleanPilot(name).toLowerCase()}
function validEntry(row){return row&&typeof row==='object'&&cleanPilot(row.name)&&Number.isSafeInteger(row.score)&&row.score>=0&&row.score<=1e9&&Number.isInteger(row.level)&&row.level>=1&&row.level<=5&&Number.isFinite(row.date)&&row.date>=0}
function rankScores(rows){const best=new Map();for(const row of rows){if(!validEntry(row))continue;const r={name:cleanPilot(row.name),score:row.score,level:row.level,date:row.date},key=pilotKey(r.name),old=best.get(key);if(!old||r.score>old.score||(r.score===old.score&&r.date<old.date))best.set(key,r)}return [...best.values()].sort((a,b)=>b.score-a.score||a.date-b.date||a.name.localeCompare(b.name,'en')).slice(0,50)}
let scores=[],storageAvailable=true,playerName='',boardReturn='pilot';
try{const raw=localStorage.getItem(SCORE_KEY);if(raw){const value=JSON.parse(raw);if(value?.version===1&&Array.isArray(value.players))scores=rankScores(value.players)}}catch(error){if(error.name!=='SyntaxError')storageAvailable=false}
try{playerName=cleanPilot(localStorage.getItem(PILOT_KEY)||'')}catch{storageAvailable=false}
function saveScore(result){if(!validEntry({...result,name:playerName,date:Date.now()}))return null;const previous=scores.find(r=>pilotKey(r.name)===pilotKey(playerName));const candidate={name:playerName,score:result.score,level:result.level,date:Date.now()};scores=rankScores([...scores,candidate]);let saved=false;try{localStorage.setItem(SCORE_KEY,JSON.stringify({version:1,players:scores}));storageAvailable=true;saved=true}catch{storageAvailable=false}const rank=scores.findIndex(r=>pilotKey(r.name)===pilotKey(playerName))+1;const receipt={rank,saved,name:candidate.name,newBest:!previous||result.score>previous.score,score:result.score};queueCloudScore(candidate,receipt);return receipt}
// Google Apps Script HTML bridge. The service remains outside the static GitHub site.
const CLOUD_CACHE_KEY='gyruss.cloud.top50.v1',CLOUD_QUEUE_KEY='gyruss.cloud.pending.v1';
const CLOUD_ORIGIN='https://cevan1304.github.io';
let cloudPlayers=null,cloudState='local',pendingScores=[],cloudWindow=null,cloudOrigin='',cloudChannel='',cloudTimer=null,cloudRPC=null,cloudSerial=0,cloudReadWanted=false,boardResult=null,cloudQueueDurable=true;
const cloudReceipts=new Map();
function validCloudPlayers(rows){return Array.isArray(rows)&&rows.length<=50&&rows.every(validEntry)}
function cloudStored(key,fallback){try{const value=JSON.parse(localStorage.getItem(key)||'null');return value?.version===1?value:fallback}catch{return fallback}}
function cloudPersist(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
const cachedCloud=cloudStored(CLOUD_CACHE_KEY,null);
if(validCloudPlayers(cachedCloud?.players))cloudPlayers=rankScores(cachedCloud.players);
const queuedCloud=cloudStored(CLOUD_QUEUE_KEY,null);
if(validCloudPlayers(queuedCloud?.players))pendingScores=rankScores(queuedCloud.players);
function cloudURL(){try{const u=new URL(window.GYRUSS_LEADERBOARD_URL);return u.origin==='https://script.google.com'&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.pathname)?u.href:''}catch{return ''}}
function cloudAllowed(){return window.location?.origin===CLOUD_ORIGIN&&Boolean(cloudURL())}
function cloudGoogleOrigin(origin){return typeof origin==='string'&&(origin==='https://script.google.com'||/^https:\/\/(?:[a-z0-9-]+\.)?googleusercontent\.com$/.test(origin))}
function cloudSetPlayers(rows){cloudPlayers=rankScores(rows);cloudPersist(CLOUD_CACHE_KEY,{version:1,players:cloudPlayers})}
function cloudQueuePersist(){return cloudQueueDurable=cloudPersist(CLOUD_QUEUE_KEY,{version:1,players:pendingScores})}
function cloudDisplayRows(){return cloudPlayers===null?scores:cloudPlayers}
function cloudRedraw(){if(!$('scoreboard').hidden)renderScores()}
function cloudStatus(){
 const pending=pendingScores.length,queued=(pending?' '+pending+' result'+(pending===1?'':'s')+' waiting to sync.':'')+(pending&&!cloudQueueDurable?' Pending sync is kept for this session only.':'');
 const backup=storageAvailable?' Local scores are saved on this device.':' Local scores are kept for this session only.';
 if(cloudState==='ready')return 'Shared TOP 50 · Google Sheets.'+(cloudRPC?' Syncing…':'')+queued;
 if(cloudState==='connecting')return 'Connecting to shared TOP 50…'+queued+backup;
 if(!cloudAllowed())return 'Shared scores are available on the online GitHub game.'+backup;
 return (cloudPlayers===null?'Local TOP 50 · Google service unavailable.':'Last synced TOP 50 · Google service unavailable.')+queued+backup;
}
function renderScores(){
 const rows=cloudDisplayRows(),result=boardResult;
 $('scoreRows').replaceChildren();rows.forEach((row,index)=>{const tr=document.createElement('tr');if(index<3)tr.classList.add('medal');if(pilotKey(row.name)===pilotKey(playerName))tr.classList.add('current-pilot');for(const value of [String(index+1).padStart(2,'0'),row.name,row.score.toLocaleString('en-US')]){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}$('scoreRows').appendChild(tr)});
 $('scoreEmpty').hidden=rows.length>0;
 $('scoreHeading').textContent=cloudPlayers===null?'TOP 50 PILOTS · LOCAL':'TOP 50 PILOTS';
 let text='One personal best per pilot. Scores from all completed levels are added together.';
 if(result){
  if(result.cloud==='saved'){const rank=cloudPlayers?.findIndex(r=>pilotKey(r.name)===pilotKey(result.name))+1;text=rank>0?result.name+' · Shared rank #'+rank:'Mission score '+result.score.toLocaleString('en-US')+' · Outside the shared TOP 50';}
  else if(cloudAllowed())text='Mission score '+result.score.toLocaleString('en-US')+' · Waiting to sync with Google Sheets.';
  else text=result.rank?(result.newBest?'New personal best':'Personal best retained')+' · '+result.name+' · Local rank #'+result.rank:'Mission score '+result.score.toLocaleString('en-US')+' · Outside the local TOP 50';
 }
 $('scoreStatus').textContent=text;$('scoreStorage').textContent=cloudStatus();
 $('syncScores').hidden=!cloudAllowed();$('syncScores').disabled=cloudState==='connecting'||Boolean(cloudRPC);$('syncScores').textContent=cloudState==='ready'?'REFRESH':'RETRY SYNC';
}
function queueCloudScore(candidate,receipt){
 if(!validEntry(candidate))return;
 receipt.cloud='pending';cloudReceipts.set(pilotKey(candidate.name),receipt);
 pendingScores=rankScores([...pendingScores,candidate]);receipt.queued=cloudQueuePersist();
 if(cloudAllowed()){if(cloudState==='ready')pumpCloud();else if(cloudState!=='connecting')connectCloud()}
}
function cloudOffline(){
 clearTimeout(cloudTimer);cloudTimer=null;if(cloudRPC)clearTimeout(cloudRPC.timer);cloudRPC=null;cloudWindow=null;cloudOrigin='';cloudState='offline';cloudRedraw();
}
function connectCloud(){
 if(!cloudAllowed()){cloudState='local';cloudRedraw();return}
 if(cloudState==='connecting')return;
 clearTimeout(cloudTimer);if(cloudRPC)clearTimeout(cloudRPC.timer);cloudRPC=null;cloudWindow=null;cloudOrigin='';cloudReadWanted=false;
 const bytes=new Uint8Array(16);window.crypto.getRandomValues(bytes);cloudChannel=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');cloudState='connecting';
 let bridge=$('cloudBridge');const url=new URL(cloudURL());url.searchParams.set('channel',cloudChannel);bridge.src=url.href;

}
function requestCloud(type,result=null){

 const id='rpc_'+(++cloudSerial),entry=result?{...result}:null;
 cloudRPC={id,type,entry,timer:setTimeout(()=>{if(cloudRPC?.id===id)cloudOffline()},15000)};
 try{cloudWindow.postMessage({type,id,channel:cloudChannel,...(entry?{result:{name:entry.name,score:entry.score,level:entry.level}}:{})},cloudOrigin)}catch{cloudOffline()}

}
function pumpCloud(){

}

  if(!validCloudPlayers(data.players)){cloudOffline();return}
  clearTimeout(cloudTimer);cloudTimer=null;cloudWindow=event.source;cloudOrigin=event.origin;cloudState='ready';cloudSetPlayers(data.players);cloudRedraw();pumpCloud();return;
 }

  const rank=data.result.players.findIndex(r=>pilotKey(r.name)===pilotKey(rpc.entry.name))+1;
  if(!Number.isInteger(data.result.rank)||data.result.rank!==rank||data.result.stored!==(rank>0)||typeof data.result.newBest!=='boolean'||(rank>0&&data.result.players[rank-1].score<rpc.entry.score)){cloudOffline();return}
  pendingScores=pendingScores.filter(row=>pilotKey(row.name)!==pilotKey(rpc.entry.name)||row.score>rpc.entry.score);cloudQueuePersist();
  const receipt=cloudReceipts.get(pilotKey(rpc.entry.name));if(receipt&&receipt.score<=rpc.entry.score){receipt.cloud='saved';receipt.cloudRank=rank}
 }
 clearTimeout(rpc.timer);cloudRPC=null;cloudSetPlayers(data.result.players);cloudRedraw();pumpCloud();
});
